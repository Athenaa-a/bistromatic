name: Compilation

on:
  push:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install dependences
        run: |
          sudo add-apt-repository -y ppa:epitech/ppa
          sudo apt-get update
          sudo apt-get install -y epiclang libcsfml-dev

      - name: Compilation with make
        run: make
